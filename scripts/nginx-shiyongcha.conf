# 实用查 · 挂到临忆录同域 /tools/shiyongcha/
# 合并进 scripts/deploy/nginx-linyilu.conf 的 server { } 内（HTTPS server）
# 本机需常驻：cd D:\projects\tool && npm run api   （默认 :5180）

# 规范尾斜杠
location = /tools/shiyongcha {
    return 301 /tools/shiyongcha/;
}

# API → 实用查 Node（须排在静态之前）
location ^~ /tools/shiyongcha/api/ {
    limit_req zone=api_read burst=60 nodelay;
    proxy_pass http://127.0.0.1:5180/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Admin-Token $http_x_admin_token;
    client_max_body_size 4m;
}

# 静态 SPA（文件来自 apps/web/public/tools/shiyongcha → 进 dist）
location ^~ /tools/shiyongcha/ {
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri $uri/ /tools/shiyongcha/index.html;
}
